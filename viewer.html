<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where your money goes</title>
<style>
  :root {
    --bg: #fbfaf8;
    --panel: #ffffff;
    --ink: #1c1b19;
    --muted: #6f6a63;
    --line: #e6e2db;
    --accent: #00a082;
    --accent-soft: #d9f0ea;
    --warn: #b45309;
    --warn-soft: #fdf1de;
    --bar2: #f4a261;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a;
      --panel: #1e1e23;
      --ink: #ececee;
      --muted: #9b968f;
      --line: #2f2f37;
      --accent: #2ec9a6;
      --accent-soft: #1d3b36;
      --warn: #f0b03f;
      --warn-soft: #33280f;
      --bar2: #e08a4e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 6px; }
  h2 { font-size: 15px; letter-spacing: -0.01em; margin: 0 0 14px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  #drop {
    border: 2px dashed var(--line);
    border-radius: var(--radius);
    padding: 44px 24px;
    text-align: center;
    background: var(--panel);
    transition: border-color .15s, background .15s;
  }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop p { margin: 0 0 14px; color: var(--muted); }
  button {
    font: inherit;
    font-weight: 500;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .err { color: var(--warn); margin-top: 14px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .kpi .v { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .kpi .l { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .notice {
    background: var(--warn-soft);
    border: 1px solid var(--line);
    border-left: 3px solid var(--warn);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .notice b { font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; overflow: hidden; }
  .card.wide { grid-column: 1 / -1; }
  .card .hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .bar { fill: var(--accent); }
  .bar.alt { fill: var(--bar2); }
  .tick { fill: var(--muted); font-size: 11px; }
  .val { fill: var(--ink); font-size: 11px; font-weight: 500; }
  .axis { stroke: var(--line); }

  .split { display: flex; height: 30px; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .split div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  .legend .a::before { background: var(--accent); }
  .legend .b::before { background: var(--bar2); }
  .legend.plain span::before { display: none; }

  select { font: inherit; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 5px 0; border-bottom: 1px solid var(--line); }
  td.n { text-align: right; color: var(--muted); white-space: nowrap; padding-left: 12px; }
  tr:last-child td { border-bottom: 0; }
  .foot { color: var(--muted); font-size: 13px; margin-top: 28px; }
  #signin { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #signin-text { color: var(--muted); font-size: 14px; margin: 0; }
  #who { margin-top: 12px; }
  section.step { border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 18px; background: var(--panel); }
  section.step h2 { font-size: 17px; margin: 0 0 8px; }
  section.step p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  #progress { color: var(--ink); font-size: 15px; }
  #pwform { display: flex; flex-direction: column; gap: 8px; width: 260px; }
  #pwform input { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  #pwform .row { display: flex; gap: 8px; }
  #pwform button { flex: 1; }
  a.bmk {
    display: inline-block; padding: 12px 18px; border-radius: 10px;
    background: var(--accent); color: #fff; font-weight: 600;
    text-decoration: none; cursor: grab;
  }
  .divider { color: var(--muted); font-size: 13px; }
  details.fallback { margin-top: 8px; }
  details.fallback summary { color: var(--muted); font-size: 13px; cursor: pointer; }
  a { color: var(--accent); }
  a.bmk { color: #fff; }
  ol.howto { margin: 0 0 14px; padding-left: 22px; }
  ol.howto li { margin: 0 0 18px; line-height: 1.5; }
  ol.howto li p { margin: 8px 0 0; }
  code { background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; font-size: 13px; }

</head>
<body>
<div class="wrap">
  <h1 id="title">Where your money goes</h1>
  <p class="sub">Drop your <code>glovo-orders-*.json</code> or <code>amazon-orders-*.json</code> export here. The file is read in your browser — this page makes no network requests at all.</p>

  <div id="drop">
    <p>Drop <code>glovo-orders-*.json</code> or <code>amazon-orders-*.json</code> here</p>
    <button id="pick">Choose a file</button>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <div id="err" class="err" hidden></div>
  </div>

  <div id="app" hidden></div>

  <p class="foot" id="foot" hidden></p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const drop = $('drop');
const app = $('app');

$('pick').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => { if (e.target.files[0]) readFile(e.target.files[0]); });

for (const type of ['dragenter', 'dragover']) {
  drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.add('over'); });
}
for (const type of ['dragleave', 'drop']) {
  drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.remove('over'); });
}
drop.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });

function fail(message) {
  const box = $('err');
  box.textContent = message;
  box.hidden = false;
}

function readFile(file) {
  $('err').hidden = true;
  const reader = new FileReader();
  reader.onerror = () => fail('Could not read the file.');
  reader.onload = () => {
    let parsed;
    try {
      parsed = JSON.parse(reader.result);
    } catch {
      fail('This is not JSON.');
      return;
    }
    if (!parsed || !Array.isArray(parsed.orders)) {
      fail('No orders array in this file — is it a glovo-export export?');
      return;
    }
    render(parsed);
  };
  reader.readAsText(file);
}

const NBSP = ' ';

function makeMoney(currency) {
  const format = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const suffix = currency === 'EUR' ? `${NBSP}€` : currency ? `${NBSP}${currency}` : '';
  return (value) => `${format.format(value)}${suffix}`;
}

function localParts(iso) {
  if (!iso) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return { month: iso.slice(0, 7), hour: null };
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return null;
  return {
    month: `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`,
    hour: date.getHours(),
  };
}

function spendOf(order) {
  if (order.excludedFromSpend) return 0;
  return order.totals?.total ?? 0;
}

function median(values) {
  if (values.length === 0) return 0;
  const sorted = [...values].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function escapeText(value) {
  return String(value).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
}

function columns(rows, formatValue, options = {}) {
  const width = 640;
  const height = options.height ?? 190;
  const padBottom = 26;
  const padTop = 20;
  const max = Math.max(...rows.map((row) => row.value), 0) || 1;
  const step = width / rows.length;
  const barWidth = Math.min(step * 0.62, 56);
  const plot = height - padBottom - padTop;

  const bars = rows.map((row, index) => {
    const barHeight = (row.value / max) * plot;
    const x = index * step + (step - barWidth) / 2;
    const y = padTop + plot - barHeight;
    const label = row.emphasis ? 'bar alt' : 'bar';
    const value = row.value > 0
      ? `<text class="val" x="${x + barWidth / 2}" y="${y - 6}" text-anchor="middle">${escapeText(formatValue(row.value))}</text>`
      : '';
    return `<rect class="${label}" x="${x}" y="${y}" width="${barWidth}" height="${Math.max(barHeight, row.value > 0 ? 2 : 0)}" rx="3"></rect>
      ${value}
      <text class="tick" x="${index * step + step / 2}" y="${height - 8}" text-anchor="middle">${escapeText(row.label)}</text>`;
  });

  return `<svg viewBox="0 0 ${width} ${height}" role="img">
    <line class="axis" x1="0" y1="${padTop + plot}" x2="${width}" y2="${padTop + plot}"></line>
    ${bars.join('')}
  </svg>`;
}

function bars(rows, formatValue) {
  const width = 640;
  const rowHeight = 30;
  const labelWidth = 190;
  const height = rows.length * rowHeight;
  const max = Math.max(...rows.map((row) => row.value), 0) || 1;
  const track = width - labelWidth - 96;

  const body = rows.map((row, index) => {
    const y = index * rowHeight;
    const barWidth = Math.max((row.value / max) * track, 2);
    return `<text class="tick" x="0" y="${y + 19}">${escapeText(row.label)}</text>
      <rect class="bar" x="${labelWidth}" y="${y + 8}" width="${barWidth}" height="14" rx="3"></rect>
      <text class="val" x="${labelWidth + barWidth + 8}" y="${y + 19}">${escapeText(formatValue(row.value))}</text>`;
  });

  return `<svg viewBox="0 0 ${width} ${height}" role="img">${body.join('')}</svg>`;
}

  [/coca.?cola|fanta|nestea|dr pepper|refresco/i, { cat: 'Soft drinks', health: 'unhealthy', mode: 'per100ml', kcal: 42, p: 0, f: 0, c: 10.5, defaultMl: 330 }],
  [/sushi|nigiri|maki|uramaki|gunkan|california roll/i, { cat: 'Cooked meals', health: 'neutral', mode: 'unit', kcal: 300, p: 12, f: 8, c: 40 }],

  [/wagyu burger|burger.*doble|doble.*burger/i, { cat: 'Fast food', health: 'unhealthy', mode: 'unit', kcal: 780, p: 38, f: 45, c: 45 }],

  [/ensalada|amanida/i, { cat: 'Fruit & veg', health: 'healthy', mode: 'unit', kcal: 190, p: 6, f: 9, c: 18 }],
  [/alitas|wings|tender.*ribs/i, { cat: 'Fast food', health: 'unhealthy', mode: 'unit', kcal: 420, p: 28, f: 28, c: 14 }],
  [/patatas fritas|papas fritas/i, { cat: 'Fast food', health: 'unhealthy', mode: 'unit', kcal: 380, p: 4, f: 19, c: 48 }],
  [/doritos|pringles|lay'?s|ruffles|patata.*(campesina|ondulada|premium)/i, { cat: 'Snacks', health: 'unhealthy', mode: 'per100g', kcal: 536, p: 6, f: 34, c: 50, defaultG: 150 }],
  [/yogur|iogurt|skyr|yopro|protein pouch|danone|kaiku/i, { cat: 'Dairy & eggs', health: 'healthy', mode: 'unit', kcal: 130, p: 11, f: 3.5, c: 13 }],
  [/queso|formatge|mozzarella|gouda|emmental/i, { cat: 'Dairy & eggs', health: 'neutral', mode: 'per100g', kcal: 330, p: 23, f: 26, c: 2, defaultG: 150 }],
  [/huevo|\bou\b|\bous\b/i, { cat: 'Dairy & eggs', health: 'healthy', mode: 'unit', kcal: 78, p: 6.5, f: 5.3, c: 0.5, qtyFromName: /docena|doc\.|12\s*u|6\s*u/i, qtyDefault: 6 }],

  [/chocolate|caramel|snickers|m&m|mentos|galleta|helado|donut|tarta|pastel/i, { cat: 'Sweets & bakery', health: 'unhealthy', mode: 'per100g', kcal: 500, p: 6, f: 25, c: 60, defaultG: 100 }],

const HEALTH_LABEL = { healthy: 'Better', neutral: 'Neutral', unhealthy: 'Worse' };
const HEALTH_COLOR = { healthy: 'var(--accent)', neutral: 'var(--line)', unhealthy: 'var(--bar2)' };

function parseGrams(name) {
  let match = /(\d+(?:[.,]\d+)?)\s*kg\b/i.exec(name);
  if (match) return parseFloat(match[1].replace(',', '.')) * 1000;
  match = /(\d+(?:[.,]\d+)?)\s*(?:g|gr|grs?|gramos)\b/i.exec(name);
  if (match) return parseFloat(match[1].replace(',', '.'));
  return null;
}

function parseMl(name) {
  let match = /(\d+(?:[.,]\d+)?)\s*(?:l|litro|litros)\b/i.exec(name);
  if (match) return parseFloat(match[1].replace(',', '.')) * 1000;
  match = /(\d+(?:[.,]\d+)?)\s*cl\b/i.exec(name);
  if (match) return parseFloat(match[1].replace(',', '.')) * 10;
  match = /(\d+(?:[.,]\d+)?)\s*ml\b/i.exec(name);
  if (match) return parseFloat(match[1].replace(',', '.'));
  return null;
}

function scalePer100(spec, amount) {
  const factor = amount / 100;
  return { kcal: spec.kcal * factor, p: spec.p * factor, f: spec.f * factor, c: spec.c * factor };
}

function classifyItem(name) {
  for (const [pattern, spec] of NUTRI_RULES) {
    if (pattern.test(name)) return spec;
  }
  return null;
}

function itemMacro(spec, name) {
  if (spec.mode === 'unit') {
    const units = spec.qtyFromName ? (spec.qtyFromName.test(name) ? spec.qtyDefault : 1) : 1;
    return { kcal: spec.kcal * units, p: spec.p * units, f: spec.f * units, c: spec.c * units };
  }
  if (spec.mode === 'per100g') return scalePer100(spec, parseGrams(name) ?? spec.defaultG);
  if (spec.mode === 'per100ml') return scalePer100(spec, parseMl(name) ?? spec.defaultMl);
  return { kcal: 0, p: 0, f: 0, c: 0 };
}

function estimateNutrition(orders) {
  const byCategory = new Map();
  const byHealth = { healthy: 0, neutral: 0, unhealthy: 0 };
  const monthMap = new Map();
  let totalKcal = 0;
  let protein = 0;
  let fat = 0;
  let carbs = 0;
  let matched = 0;
  let unmatched = 0;
  let nonfood = 0;
  let ordersWithFood = 0;

  for (const order of orders) {
    let orderKcal = 0;
    let hasFood = false;
    for (const item of order.items ?? []) {
      if (!item.charged || !item.name) continue;
      const quantity = item.quantity ?? 1;
      const spec = classifyItem(item.name);
      if (!spec) { unmatched += quantity; continue; }
      if (spec.mode === 'nonfood') { nonfood += quantity; continue; }
      const macro = itemMacro(spec, item.name);
      matched += quantity;
      hasFood = true;
      orderKcal += macro.kcal * quantity;
      protein += macro.p * quantity;
      fat += macro.f * quantity;
      carbs += macro.c * quantity;
      byHealth[spec.health] += quantity;
      const entry = byCategory.get(spec.cat) ?? { items: 0, kcal: 0 };
      entry.items += quantity;
      entry.kcal += macro.kcal * quantity;
      byCategory.set(spec.cat, entry);
    }
    if (!hasFood) continue;
    ordersWithFood += 1;
    totalKcal += orderKcal;
    const parts = localParts(order.date);
    if (!parts) continue;
    const bucket = monthMap.get(parts.month) ?? { kcal: 0, orders: 0 };
    bucket.kcal += orderKcal;
    bucket.orders += 1;
    monthMap.set(parts.month, bucket);
  }

  const monthly = [...monthMap.entries()].sort((a, b) => a[0].localeCompare(b[0]))
    .map(([key, bucket]) => ({ label: key.slice(2).replace('-', '.'), value: bucket.kcal / bucket.orders }));
  const categories = [...byCategory.entries()].sort((a, b) => b[1].kcal - a[1].kcal);
  const foodItems = matched + unmatched;

  return {
    totalKcal,
    protein,
    fat,
    carbs,
    matched,
    unmatched,
    nonfood,
    ordersWithFood,
    coverage: foodItems ? matched / foodItems : 0,
    avgKcal: ordersWithFood ? totalKcal / ordersWithFood : 0,
    byHealth,
    categories,
    monthly,
  };
}

function nutritionCards(nutrition) {
  if (!nutrition.matched) return '';
  const kcal = (value) => `${Math.round(value).toLocaleString()} kcal`;
  const healthTotal = nutrition.byHealth.healthy + nutrition.byHealth.neutral + nutrition.byHealth.unhealthy;
  const healthKeys = ['healthy', 'neutral', 'unhealthy'];

  return `
      <div class="card wide">
        <h2>Estimated calories</h2>
        <div class="kpis">
          <div class="kpi"><div class="v">${kcal(nutrition.avgKcal)}</div><div class="l">per order on average</div></div>
          <div class="kpi"><div class="v">${kcal(nutrition.totalKcal)}</div><div class="l">recognised in total</div></div>
          <div class="kpi"><div class="v">${Math.round(nutrition.coverage * 100)}%</div><div class="l">of food items recognised</div></div>
          <div class="kpi"><div class="v">${Math.round(nutrition.protein)} / ${Math.round(nutrition.fat)} / ${Math.round(nutrition.carbs)} g</div><div class="l">protein / fat / carbs</div></div>
        </div>
        ${nutrition.monthly.length ? columns(nutrition.monthly, (value) => Math.round(value)) : ''}
        <p class="hint">Average kcal per order per month. <b>This is a guess from item names</b> — no nutrition database is consulted. ${nutrition.unmatched ? `${Math.round(nutrition.unmatched)} items matched no rule and count as zero, so every number here is a floor, not a total.` : ''} Restaurant portions vary wildly; treat it as an order of magnitude.</p>
      </div>

      <div class="card">
        <h2>Better vs worse</h2>
        <div class="split">${healthKeys.map((key) => {
          const share = (nutrition.byHealth[key] / (healthTotal || 1)) * 100;
          return `<div style="width:${share}%;background:${HEALTH_COLOR[key]};color:${key === 'neutral' ? 'var(--ink)' : '#fff'}">${share >= 12 ? `${Math.round(share)}%` : ''}</div>`;
        }).join('')}</div>
        <div class="legend plain">${healthKeys.map((key) =>
          `<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:${HEALTH_COLOR[key]}"></i>${HEALTH_LABEL[key]} — ${Math.round(nutrition.byHealth[key])} items</span>`,
        ).join('')}</div>
        <p class="hint">Fruit, veg, fish, poultry, eggs and yoghurt count as better; alcohol, soft drinks, sweets, crisps and fast food as worse; everything else is neutral. ${nutrition.nonfood ? `${Math.round(nutrition.nonfood)} non-food items (cleaning, pet food) are excluded.` : ''}</p>
      </div>

      <div class="card">
        <h2>Calories by category</h2>
        <table>${nutrition.categories.map(([name, entry]) =>
          `<tr><td>${escapeText(name)}</td><td class="n">${Math.round(entry.items)}×</td><td class="n">${kcal(entry.kcal)}</td></tr>`,
        ).join('')}</table>
        <p class="hint">Categories come from the same keyword rules, so an unrecognised item lands in no category at all.</p>
      </div>
`;
}

function render(file) {
  const orders = file.orders;
  const source = file.meta?.source ?? 'glovo';
  const amazon = source === 'amazon';
  const sourceName = amazon ? 'Amazon' : 'Glovo';
  const storeWord = amazon ? 'seller' : 'store';
  document.title = `Where your money goes on ${sourceName}`;
  $('title').textContent = `Where your money goes on ${sourceName}`;
  const currency = orders.find((order) => order.currency)?.currency ?? null;
  const money = makeMoney(currency);

  const counted = orders.filter((order) => !order.excludedFromSpend);
  const cancelled = orders.filter((order) => order.excludedFromSpend === 'cancelled');
  const refunded = counted.filter((order) => order.refunded);
  const totalSpend = orders.reduce((sum, order) => sum + spendOf(order), 0);
  const refundedSpend = refunded.reduce((sum, order) => sum + spendOf(order), 0);
  const sizes = counted.map(spendOf).filter((value) => value > 0);

  const byMonth = new Map();
  const byHour = new Map();
  let undated = 0;
  for (const order of counted) {
    const parts = localParts(order.date);
    if (!parts) { undated += 1; continue; }
    byMonth.set(parts.month, (byMonth.get(parts.month) ?? 0) + spendOf(order));
    if (parts.hour !== null) byHour.set(parts.hour, (byHour.get(parts.hour) ?? 0) + 1);
  }
  const hasHours = byHour.size > 0;

  const months = [...byMonth.entries()].sort((a, b) => a[0].localeCompare(b[0]))
    .map(([key, value]) => ({ label: key.slice(2).replace('-', '.'), value }));

  const hours = [];
  for (let hour = 0; hour < 24; hour += 1) {
    hours.push({ label: hour % 3 === 0 ? String(hour) : '', value: byHour.get(hour) ?? 0 });
  }

  const byStore = new Map();
  for (const order of counted) {
    const name = order.store?.name ?? 'unnamed';
    const entry = byStore.get(name) ?? { spend: 0, count: 0 };
    entry.spend += spendOf(order);
    entry.count += 1;
    byStore.set(name, entry);
  }
  const stores = [...byStore.entries()].sort((a, b) => b[1].spend - a[1].spend).slice(0, 10)
    .map(([name, entry]) => ({ label: `${name} (${entry.count})`, value: entry.spend }));

  const splitKey = amazon
    ? (order) => (order.store?.name === 'Amazon' ? 'Amazon' : 'Third-party sellers')
    : (order) => ({ FOOD: 'Restaurants', Q_COMMERCE: 'Groceries' }[order.vertical] ?? order.vertical ?? 'UNKNOWN');
  const bySplit = new Map();
  for (const order of counted) {
    const key = splitKey(order);
    const entry = bySplit.get(key) ?? { spend: 0, count: 0 };
    entry.spend += spendOf(order);
    entry.count += 1;
    bySplit.set(key, entry);
  }
  const splits = [...bySplit.entries()].sort((a, b) => b[1].spend - a[1].spend);

  const edges = [0, 10, 20, 30, 40, 50, 60];
  const buckets = edges.map((edge, index) => ({
    label: index === edges.length - 1 ? '60+' : `${edge}–${edges[index + 1]}`,
    value: 0,
  }));
  for (const size of sizes) {
    let index = edges.findIndex((edge, position) => position === edges.length - 1 || size < edges[position + 1]);
    if (index < 0) index = edges.length - 1;
    buckets[index].value += 1;
  }

  let discountTotal = 0;
  let discountedItems = 0;
  for (const order of counted) {
    for (const item of order.items ?? []) {
      if (item.charged && typeof item.discount === 'number' && item.discount < 0) {
        discountTotal += item.discount;
        discountedItems += 1;
      }
    }
  }

  const dates = counted.map((order) => order.date).filter(Boolean).sort();
  const range = dates.length ? `${dates[0].slice(0, 10)} — ${dates[dates.length - 1].slice(0, 10)}` : 'no dates';
  const monthlyAverage = months.length ? totalSpend / months.length : 0;

  const notices = [];
  if (cancelled.length) {
    notices.push(`<b>${cancelled.length}</b> cancelled orders excluded — they carry no total.`);
  }
  if (refunded.length) {
    notices.push(`<b>${refunded.length}</b> refunded orders worth ${money(refundedSpend)} are <b>counted</b>: the export never learns how much was returned, so spend keeps what was actually charged.`);
  }
  if (undated) {
    notices.push(`<b>${undated}</b> orders have no date and are missing from the month${hasHours ? ' and hour' : ''} charts.`);
  }
  const mismatches = counted.filter((order) => order.validation?.productsMatch === false).length;
  if (mismatches) {
    notices.push(amazon
      ? `In <b>${mismatches}</b> orders the item prices do not add up to the items subtotal — usually a per-item promotion the order page shows only in the totals. Totals are unaffected.`
      : `In <b>${mismatches}</b> orders the item sum disagrees with the PRODUCTS line — normal for groceries, where the basket changes after picking. Totals are unaffected.`);
  }

  const nutrition = amazon ? null : estimateNutrition(counted);

  const storeNames = [...byStore.keys()].sort((a, b) => byStore.get(b).count - byStore.get(a).count);

  app.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="v">${money(totalSpend)}</div><div class="l">total for ${escapeText(range)}</div></div>
      <div class="kpi"><div class="v">${counted.length}</div><div class="l">orders counted</div></div>
      <div class="kpi"><div class="v">${money(monthlyAverage)}</div><div class="l">per month on average</div></div>
      <div class="kpi"><div class="v">${money(median(sizes))}</div><div class="l">median order</div></div>
      ${amazon ? '' : `<div class="kpi"><div class="v">${money(Math.abs(discountTotal))}</div><div class="l">discounts caught (${discountedItems} items)</div></div>`}
    </div>

    ${notices.length ? `<div class="notice">${notices.join('<br>')}</div>` : ''}

    <div class="grid">
      <div class="card wide">
        <h2>Spend by month</h2>
        ${columns(months, (value) => Math.round(value))}
        <p class="hint">${hasHours ? 'Months are bucketed in your local timezone, not UTC.' : `${sourceName} records the order date only, so no timezone conversion is needed.`}</p>
      </div>

      <div class="card wide">
        <h2>${amazon ? 'Amazon vs third-party sellers' : 'Restaurants vs groceries'}</h2>
        <div class="split">${splits.map((entry, index) => {
          const share = (entry[1].spend / (totalSpend || 1)) * 100;
          const color = index === 0 ? 'var(--accent)' : 'var(--bar2)';
          return `<div style="width:${share}%;background:${color}">${share >= 12 ? `${Math.round(share)}%` : ''}</div>`;
        }).join('')}</div>
        <div class="legend">${splits.map((entry, index) => {
          return `<span class="${index === 0 ? 'a' : 'b'}">${escapeText(entry[0])} — ${money(entry[1].spend)}, ${entry[1].count} orders</span>`;
        }).join('')}</div>
      </div>

      <div class="card">
        <h2>Top ${storeWord}s by spend</h2>
        ${bars(stores, money)}
        <p class="hint">Order count in brackets.</p>
      </div>

      <div class="card">
        <h2>Order size</h2>
        ${columns(buckets, (value) => value)}
        <p class="hint">How many orders fall into each band, ${currency === 'EUR' ? '€' : currency ?? ''}.</p>
      </div>

      ${hasHours ? `<div class="card wide">
        <h2>Time of day</h2>
        ${columns(hours, (value) => (value ? value : ''), { height: 170 })}
        <p class="hint">Local hours (${escapeText(Intl.DateTimeFormat().resolvedOptions().timeZone)}). The export stores dates in UTC; they are converted here.</p>
      </div>` : ''}

      <div class="card wide">
        <h2>What you order most</h2>
        <select id="store-pick">${storeNames.map((name) => `<option>${escapeText(name)}</option>`).join('')}</select>
        <div id="store-items"></div>
        <p class="hint">${amazon
          ? 'Within a single seller only. Quantities are what the order page shows; prices are per line.'
          : 'Within a single store only: different stores name the same product differently (&laquo;Agua Mineral 1,5 L 1 Ud.&raquo; and &laquo;Agua Mineral, Botella 1,5 L.&raquo; are the same water), so a top list across all stores would be a lie.'}</p>
      </div>
${nutrition ? nutritionCards(nutrition) : ''}
    </div>
  `;

  const picker = $('store-pick');
  const renderItems = () => {
    const name = picker.value;
    const items = new Map();
    for (const order of counted) {
      if ((order.store?.name ?? 'unnamed') !== name) continue;
      for (const item of order.items ?? []) {
        if (!item.charged || !item.name) continue;
        const entry = items.get(item.name) ?? { count: 0, spend: 0 };
        entry.count += item.quantity ?? 1;
        entry.spend += item.lineTotal ?? 0;
        items.set(item.name, entry);
      }
    }
    const top = [...items.entries()].sort((a, b) => b[1].spend - a[1].spend).slice(0, 12);
    $('store-items').innerHTML = top.length
      ? `<table>${top.map(([label, entry]) =>
          `<tr><td>${escapeText(label)}</td><td class="n">${entry.count % 1 ? entry.count.toFixed(1) : entry.count}×</td><td class="n">${money(entry.spend)}</td></tr>`,
        ).join('')}</table>`
      : `<p class="hint">No charged items in this ${storeWord}.</p>`;
  };
  picker.addEventListener('change', renderItems);
  renderItems();

  drop.hidden = true;
  app.hidden = false;
  const foot = $('foot');
  foot.textContent = file.meta
    ? `${sourceName}${file.meta.marketplace ? ` (${file.meta.marketplace})` : ''} · exported ${(file.meta.exportedAt ?? '').slice(0, 10)} · ${orders.length} orders in the file · ${file.meta.warnings?.length ?? 0} parser warnings`
    : `${orders.length} orders from your account`;
  foot.hidden = false;
}
</script>
</body>
</html>
